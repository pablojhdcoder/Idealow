# PostgreSQL con extensión pgvector (imagen oficial pgvector/pgvector).
#
# Puerto 5433 en el host para NO chocar con PostgreSQL instalado en Windows (suele usar 5432).
# URL: postgresql://postgres:password@localhost:5433/idealow?schema=public
#
# Uso:
#   docker compose up -d
#   cd backend && npx prisma migrate dev
#
# Si no tienes otro Postgres en Windows, puedes usar "5432:5432" y localhost:5432 en DATABASE_URL.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: idealow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: idealow
    ports:
      - "5433:5432"
    volumes:
      - idealow_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d idealow"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  idealow_pgdata:
